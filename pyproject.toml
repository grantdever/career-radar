[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-radar"
version = "0.1.0"
description = "A lightweight AI-powered job search CLI that learns your preferences."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Grant Dever" }
]
keywords = [
    "job-search",
    "cli",
    "ats",
    "careers",
    "ai",
    "llm",
    "litellm",
    "workday",
    "greenhouse",
    "lever",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "litellm>=1.20.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/grantdever/career-radar"
Repository = "https://github.com/grantdever/career-radar"
Issues = "https://github.com/grantdever/career-radar/issues"

[project.scripts]
career-radar = "career_radar.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
